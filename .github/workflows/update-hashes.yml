name: Update flamenco package hashes

on:
  workflow_dispatch:

jobs:
  update-hashes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update hashes iteratively
        run: |
          python3 << 'EOF'
          import subprocess
          import re
          import sys

          NIX_FILE = "hubble-flamenco.nix"

          def run_build():
              result = subprocess.run(
                  ["nix", "build", ".#flamenco", "--no-link"],
                  capture_output=True, text=True
              )
              return result.stdout + result.stderr

          def extract_got_hash(output):
              # Nix prints: "got:    sha256-<hash>" when a hash mismatches
              m = re.search(r'got:\s+(sha256-[A-Za-z0-9+/=]+)', output)
              if m:
                  return m.group(1)
              return None

          def replace_first_fake_hash(content, new_hash, pattern):
              # Replace the first occurrence of pattern containing lib.fakeHash
              new_content, count = re.subn(
                  pattern,
                  lambda m: m.group(0).replace('lib.fakeHash', f'"{new_hash}"'),
                  content,
                  count=1
              )
              return new_content, count > 0

          with open(NIX_FILE) as f:
              content = f.read()

          # Step 1: fix src hash (first 'hash = lib.fakeHash')
          print("=== Step 1: fixing src hash ===")
          output = run_build()
          print(output[-3000:])
          got = extract_got_hash(output)
          if got:
              print(f"Replacing src hash with: {got}")
              content, ok = replace_first_fake_hash(content, got, r'hash = lib\.fakeHash;')
              if not ok:
                  print("ERROR: could not find 'hash = lib.fakeHash;' for src", file=sys.stderr)
                  sys.exit(1)
              with open(NIX_FILE, 'w') as f:
                  f.write(content)
          else:
              print("No hash mismatch found for src - already correct or build failed for another reason")

          # Step 2: fix webappOfflineCache hash (second 'hash = lib.fakeHash')
          print("=== Step 2: fixing webappOfflineCache hash ===")
          output = run_build()
          print(output[-3000:])
          got = extract_got_hash(output)
          if got:
              print(f"Replacing yarn hash with: {got}")
              content, ok = replace_first_fake_hash(content, got, r'hash = lib\.fakeHash;')
              if not ok:
                  print("ERROR: could not find 'hash = lib.fakeHash;' for yarn", file=sys.stderr)
                  sys.exit(1)
              with open(NIX_FILE, 'w') as f:
                  f.write(content)
          else:
              print("No hash mismatch found for yarn - already correct or build failed for another reason")

          # Step 3: fix vendorHash
          print("=== Step 3: fixing vendorHash ===")
          output = run_build()
          print(output[-3000:])
          got = extract_got_hash(output)
          if got:
              print(f"Replacing vendorHash with: {got}")
              content, ok = replace_first_fake_hash(content, got, r'vendorHash = lib\.fakeHash;')
              if not ok:
                  print("ERROR: could not find 'vendorHash = lib.fakeHash;'", file=sys.stderr)
                  sys.exit(1)
              with open(NIX_FILE, 'w') as f:
                  f.write(content)
          else:
              print("No hash mismatch found for vendorHash - already correct or build failed for another reason")

          # Final build check
          print("=== Final build check ===")
          output = run_build()
          print(output[-3000:])
          EOF

      - name: Show updated file
        run: cat hubble-flamenco.nix

      - name: Commit and push hash updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hubble-flamenco.nix
          if git diff --staged --quiet; then
            echo "No hash changes to commit"
          else
            git commit -m "chore: update flamenco 3.9 package hashes"
            git push
          fi

